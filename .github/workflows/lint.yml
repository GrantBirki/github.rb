name: lint

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

cache-mode: none

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - uses: openai/fence@7cba9082252803421a0e433f29198de6d0063221 # pin@v0.13.1

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v6
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # pin@v1.334.0
        with:
          bundler: none
          bundler-cache: false

      - name: bootstrap
        run: script/bootstrap

      - name: lint
        run: script/lint
